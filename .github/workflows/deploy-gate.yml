name: deploy-gate

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ipet
          POSTGRES_PASSWORD: ipet
          POSTGRES_DB: ipet
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ipet"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    defaults:
      run:
        working-directory: iPet-BackEnd
    env:
      PORT: "3000"
      JWT_SECRET: "ci-gate-secret-key"
      CLIENT_ORIGIN: "http://localhost:5173"
      REDIS_URL: "redis://127.0.0.1:6379"
      DATABASE_URL: "postgresql://ipet:ipet@127.0.0.1:5432/ipet?schema=public&connection_limit=20"
      BASE_URL: "http://127.0.0.1:3000"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: iPet-BackEnd/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # ========================================
      # 🚨 GATE: Enforce database migrations
      # ========================================
      - name: Run Prisma migrations
        run: npx prisma migrate deploy

      - name: Build application
        run: npm run build

      - name: Start backend server
        run: |
          nohup node dist/main.js > backend.log 2>&1 &
          echo "Waiting for backend to start..."
          for i in {1..30}; do
            curl -sf "$BASE_URL/api/infra/health" > /dev/null && exit 0
            sleep 1
          done
          echo "❌ Backend did not start in time"
          tail -n 100 backend.log || true
          exit 1

      # ========================================
      # 🚨 GATE: Run smoke tests
      # ========================================
      - name: Run smoke tests
        run: |
          chmod +x scripts/smoke_test.sh
          bash scripts/smoke_test.sh

      - name: Upload backend logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: iPet-BackEnd/backend.log
          retention-days: 7

  # ========================================
  # E2E Tests Stage
  # ========================================
  e2e-tests:
    runs-on: ubuntu-latest
    needs: deploy-gate
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ipet
          POSTGRES_PASSWORD: ipet
          POSTGRES_DB: ipet
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ipet"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      PORT: "3000"
      JWT_SECRET: "ci-gate-secret-key"
      CLIENT_ORIGIN: "http://localhost:5173"
      REDIS_URL: "redis://127.0.0.1:6379"
      DATABASE_URL: "postgresql://ipet:ipet@127.0.0.1:5432/ipet?schema=public&connection_limit=20"
      BASE_URL: "http://127.0.0.1:5173"
      BACKEND_URL: "http://127.0.0.1:3000"
      E2E_TEST_EMAIL: "e2e-test@ipet.test"
      E2E_TEST_PASSWORD: "Test123456!"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            iPet-BackEnd/package-lock.json
            iPet-uniapp/package-lock.json
            package-lock.json

      # Backend setup
      - name: Install backend dependencies
        working-directory: iPet-BackEnd
        run: npm ci

      - name: Generate Prisma client
        working-directory: iPet-BackEnd
        run: npx prisma generate

      - name: Run Prisma migrations
        working-directory: iPet-BackEnd
        run: npx prisma migrate deploy

      - name: Build backend
        working-directory: iPet-BackEnd
        run: npm run build

      - name: Start backend server
        working-directory: iPet-BackEnd
        run: |
          nohup node dist/main.js > backend.log 2>&1 &
          echo "Waiting for backend to start..."
          for i in {1..30}; do
            curl -sf "$BACKEND_URL/api/infra/health" > /dev/null && exit 0
            sleep 1
          done
          echo "❌ Backend did not start in time"
          tail -n 100 backend.log || true
          exit 1

      # Frontend setup
      - name: Install frontend dependencies
        working-directory: iPet-uniapp
        run: npm ci

      - name: Build H5 frontend
        working-directory: iPet-uniapp
        run: npm run build:h5

      - name: Serve frontend
        working-directory: iPet-uniapp
        run: |
          npx serve dist/build/h5 -l 5173 &
          sleep 5
          curl -sf "http://127.0.0.1:5173" > /dev/null || exit 1

      # E2E tests
      - name: Install root dependencies (Playwright)
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            playwright-report/
            test-results/
            iPet-BackEnd/backend.log
          retention-days: 7
