name: perf-nightly

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  k6:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ipet
          POSTGRES_PASSWORD: ipet
          POSTGRES_DB: ipet
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ipet"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    defaults:
      run:
        working-directory: iPet-BackEnd
    env:
      PORT: "3000"
      JWT_SECRET: "ci-secret"
      CLIENT_ORIGIN: "http://localhost:5173"
      REDIS_URL: "redis://127.0.0.1:6379"
      DATABASE_URL: "postgresql://ipet:ipet@127.0.0.1:5432/ipet?schema=public&connection_limit=20"
      PERF_EMAIL: "perf@example.com"
      PERF_PASSWORD: "perf-password"
      PERF_PET_ID: "00000000-0000-4000-8000-000000000001"
      BASE_URL: "http://127.0.0.1:3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: iPet-BackEnd/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:push
      - run: npm run seed:k6
      - run: npm run build
      - name: Start backend
        run: |
          nohup node dist/main.js > backend.log 2>&1 &
          for i in {1..30}; do
            curl -sf "$BASE_URL/api/articles?category=all&page=1&limit=20" >/dev/null && exit 0
            sleep 1
          done
          echo "Backend did not start in time"
          tail -n 200 backend.log || true
          exit 1
      - name: k6 run
        uses: grafana/k6-action@v0.3.1
        with:
          filename: iPet-BackEnd/perf/k6/api-smoke.js
        env:
          BASE_URL: ${{ env.BASE_URL }}
          PERF_EMAIL: ${{ env.PERF_EMAIL }}
          PERF_PASSWORD: ${{ env.PERF_PASSWORD }}
          PERF_PET_ID: ${{ env.PERF_PET_ID }}

