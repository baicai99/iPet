name: Build & Size Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-matrix:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - h5
          - mp-weixin
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: iPet-uniapp/package-lock.json
      
      - name: Install dependencies
        working-directory: ./iPet-uniapp
        run: npm ci
      
      - name: Validate Environment (Production)
        working-directory: ./iPet-uniapp
        run: npm run check:env:production
      
      - name: Type check
        working-directory: ./iPet-uniapp
        run: npm run type-check
      
      - name: Build ${{ matrix.platform }}
        working-directory: ./iPet-uniapp
        run: npm run build:${{ matrix.platform }}
      
      - name: Check WeChat Mini Program size
        if: matrix.platform == 'mp-weixin'
        working-directory: ./iPet-uniapp
        run: npm run check:size:mp-weixin

  # 依赖安全审计 (可选，仅在 PR 时运行)
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        working-directory: ./iPet-uniapp
        run: npm ci
      
      - name: Run npm audit
        working-directory: ./iPet-uniapp
        run: npm audit --production --audit-level=high
        continue-on-error: true  # 不阻塞 PR，仅报告
