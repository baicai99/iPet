name: Build & Size Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-mp-weixin:
    name: Build WeChat Mini Program
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: iPet-uniapp/package-lock.json
      
      - name: Install dependencies
        working-directory: ./iPet-uniapp
        run: npm ci
      
      - name: Type check
        working-directory: ./iPet-uniapp
        run: npm run type-check
      
      - name: Build WeChat Mini Program
        working-directory: ./iPet-uniapp
        run: npm run build:mp-weixin
      
      - name: Check package size
        working-directory: ./iPet-uniapp
        run: |
          # 检测微信小程序“主包”大小（不包含分包；插件不计入本仓构建产物）
          # 主包限制: 1.5MB = 1572864 bytes
          node scripts/dist/check-mp-weixin-size.mjs --dist dist/build/mp-weixin --limitBytes 1572864 --warnBytes 1415577

  # 依赖安全审计 (可选，仅在 PR 时运行)
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        working-directory: ./iPet-uniapp
        run: npm ci
      
      - name: Run npm audit
        working-directory: ./iPet-uniapp
        run: npm audit --production --audit-level=high
        continue-on-error: true  # 不阻塞 PR，仅报告
