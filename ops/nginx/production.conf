# iPet Nginx 生产配置
#
# 部署方式：
#   1. 将此文件复制到 /etc/nginx/sites-available/ipet
#   2. 创建软链接：ln -s /etc/nginx/sites-available/ipet /etc/nginx/sites-enabled/
#   3. 验证配置：nginx -t
#   4. 重载服务：systemctl reload nginx
#
# 依赖：
#   - Let's Encrypt 证书（使用 certbot 获取）
#   - 后端服务运行在 127.0.0.1:3000
#

# ============================================================
# Upstream 定义
# ============================================================
upstream ipet_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ============================================================
# 通用配置
# ============================================================

# Gzip 压缩（如果未在 nginx.conf 中全局启用）
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml
    application/xml+rss
    application/x-javascript
    image/svg+xml;

# ============================================================
# API 站点 - api.zhengjiyuan.top
# ============================================================

# HTTP → HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name api.zhengjiyuan.top;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 服务
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.zhengjiyuan.top;

    # ----------------------------------------------------------
    # TLS 配置
    # ----------------------------------------------------------
    ssl_certificate /etc/letsencrypt/live/api.zhengjiyuan.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.zhengjiyuan.top/privkey.pem;

    # TLS 协议版本
    ssl_protocols TLSv1.2 TLSv1.3;

    # 密码套件
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL Session 优化
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ----------------------------------------------------------
    # 安全 Headers
    # ----------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ----------------------------------------------------------
    # 超时配置
    # ----------------------------------------------------------
    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    send_timeout 60s;

    # ----------------------------------------------------------
    # 反向代理配置
    # ----------------------------------------------------------
    location / {
        proxy_pass http://ipet_backend;
        proxy_http_version 1.1;

        # Header 透传
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # X-Request-Id 透传（关键！）
        # 如果客户端未提供，Nginx 生成新的
        set $request_id_header $http_x_request_id;
        if ($request_id_header = '') {
            set $request_id_header $request_id;
        }
        proxy_set_header X-Request-Id $request_id_header;

        # WebSocket 支持（如需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 保持连接
        proxy_set_header Connection "";

        # 缓冲配置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 24k;
    }

    # 健康检查端点（可选：不记录日志）
    location /api/system/health {
        proxy_pass http://ipet_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location /api/system/ready {
        proxy_pass http://ipet_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # 拒绝访问隐藏文件
    location ~ /\. {
        deny all;
    }

    # 错误页面
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

# ============================================================
# 前端站点 - ipet.zhengjiyuan.top
# ============================================================

# HTTP → HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name ipet.zhengjiyuan.top;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 服务
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ipet.zhengjiyuan.top;

    # 前端静态文件根目录
    root /var/www/ipet;
    index index.html;

    # ----------------------------------------------------------
    # TLS 配置（与 API 站点相同）
    # ----------------------------------------------------------
    ssl_certificate /etc/letsencrypt/live/ipet.zhengjiyuan.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ipet.zhengjiyuan.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ----------------------------------------------------------
    # 安全 Headers
    # ----------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ----------------------------------------------------------
    # 静态资源缓存
    # ----------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ----------------------------------------------------------
    # SPA 路由 - 所有路径回退到 index.html
    # ----------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 拒绝访问隐藏文件
    location ~ /\. {
        deny all;
    }

    # 错误页面
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
